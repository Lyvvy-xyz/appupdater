name: click-test

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Server images ship Edge but not always the registered WebView2 Runtime;
      # without it host.ps1 installs it or shows a blocking MessageBox.
      - name: Ensure WebView2 Runtime
        shell: powershell
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id"
          $pv = $keys | ForEach-Object { (Get-ItemProperty $_ -Name pv -ErrorAction SilentlyContinue).pv } | Select-Object -First 1
          if (-not $pv) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2setup.exe" -UseBasicParsing
            Start-Process "$env:RUNNER_TEMP\wv2setup.exe" '/silent /install' -Wait
            $pv = $keys | ForEach-Object { (Get-ItemProperty $_ -Name pv -ErrorAction SilentlyContinue).pv } | Select-Object -First 1
            Write-Host "::notice::WebView2 Runtime was missing; installed $pv"
          } else { Write-Host "::notice::WebView2 Runtime present: $pv" }

      - name: Smoke-test host.ps1 over CDP (Windows PowerShell 5.1)
        shell: powershell
        run: .\click-test.ps1 -Reset

      # Surface the tail of the app log as an annotation - readable without a token.
      - name: App log
        if: always()
        shell: powershell
        run: |
          if (Test-Path AppUpdater.log) {
            $tail = (Get-Content AppUpdater.log -Tail 15) -join '%0A'
            Write-Host "::notice title=AppUpdater.log tail::$tail"
          }
