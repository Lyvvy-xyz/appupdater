name: click-test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Static bridge checks
        run: bash check.sh
      - name: Release failure regressions
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Reliability regressions
        shell: pwsh
        run: ./tests/reliability.ps1
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 5.1 reliability regressions
        shell: powershell
        run: ./tests/reliability.ps1

      - name: Real Intune package round trip
        shell: powershell
        run: ./tests/package-roundtrip.ps1

      # Server images ship Edge but not always the registered WebView2 Runtime;
      # without it host.ps1 installs it or shows a blocking MessageBox.
      - name: Ensure WebView2 Runtime
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path host.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { throw ($errors.Message -join '; ') }
          foreach ($node in $ast.EndBlock.Statements) {
            if ($node -is [Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -in @('Test-WebView2RuntimeInstalled', 'Install-WebView2Runtime')) {
              . ([scriptblock]::Create($node.Extent.Text))
            }
          }
          if (-not (Test-WebView2RuntimeInstalled) -and -not (Install-WebView2Runtime)) {
            throw 'WebView2 runtime installation failed.'
          }

      - name: Smoke-test AppUpdater.ps1 over CDP (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Copy-Item -LiteralPath host.ps1 -Destination AppUpdater.ps1
          if ((Get-FileHash host.ps1).Hash -ne (Get-FileHash AppUpdater.ps1).Hash) { throw 'Release filename copy differs from host.ps1.' }
          try { .\click-test.ps1 -HostPath (Join-Path $PWD 'AppUpdater.ps1') -Reset }
          catch { Write-Host "::error::$($_.Exception.Message)%0A$($_.InvocationInfo.PositionMessage -replace "`r?`n", '%0A')"; exit 1 }
          if ($LASTEXITCODE) { Write-Host "::error::click-test.ps1 exit code $LASTEXITCODE"; exit $LASTEXITCODE }

      # Surface the tail of the app log as an annotation - readable without a token.
      - name: App log
        if: always()
        shell: powershell
        run: |
          if (Test-Path AppUpdater.log) {
            $tail = (Get-Content AppUpdater.log -Tail 15) -join '%0A'
            Write-Host "::notice title=AppUpdater.log tail::$tail"
          }
