name: release

# Releases whenever main carries an engine version that has no release yet,
# so bumping $global:Version is all it takes to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appupdater-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/click-test.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Stable asset name so .../releases/latest/download/AppUpdater.ps1 always works.
      - name: Publish AppUpdater.ps1 if this version is unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/publish-release.py
