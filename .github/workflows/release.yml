name: release

# Releases whenever main carries an engine version that has no release yet,
# so bumping $global:Version is all it takes to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable asset name so .../releases/latest/download/AppUpdater.ps1 always works.
      - name: Publish host.ps1 as AppUpdater.ps1 if this version is unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 .github/check-version.py)"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          cp host.ps1 AppUpdater.ps1
          gh release create "$tag" AppUpdater.ps1 --target "$GITHUB_SHA" \
            --title "AppUpdater $tag" \
            --generate-notes \
            --notes "Download \`AppUpdater.ps1\` and run it in Windows PowerShell 5.1 as admin - it fetches everything else (WebView2 SDK and runtime, IntuneWinAppUtil, PSAppDeployToolkit) on first run.

          Always-latest link: https://github.com/${{ github.repository }}/releases/latest/download/AppUpdater.ps1"
