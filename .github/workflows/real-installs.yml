name: real-installs

# Packages real vendor installers and installs, detects and uninstalls each one as SYSTEM on a throwaway runner.
# Every push runs each app as a Simple package plus the scenario jobs; the weekly and manual runs also package every plain
# app as PSADT v3, PSADT v4 and Runtime. The app list is tests/apps.json.
# Apps preinstalled on the runner image (Git, Node.js, the VC++ runtime, Python) are left out: their installers refuse to downgrade or clash with the image's copy.
on:
  push:
    paths:
      - host.ps1
      - tests/real-installs.ps1
      - tests/apps.json
      - .github/workflows/real-installs.yml
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        shell: python
        env:
          ALL_TYPES: ${{ github.event_name != 'push' }}
        run: |
          import json, os
          apps = json.load(open('tests/apps.json'))
          jobs = [dict(a, name=a['app']) for a in apps]
          if os.environ['ALL_TYPES'] == 'true':
              for a in apps:
                  if a.get('scenario') or a.get('simpleOnly'):
                      continue
                  for deploy in ('psadt-v3', 'psadt-v4', 'runtime'):
                      # Per-user installers cannot be run by the agent, which works as SYSTEM.
                      if deploy == 'runtime' and a.get('perUser'):
                          continue
                      jobs.append(dict(a, deploy=deploy, name=f"{a['app']}-{deploy}"))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps({'include': jobs}) + '\n')

  install:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Week
        id: week
        shell: bash
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # A fallback copy of each installer for when the vendor's download fails or the version is withdrawn.
      - uses: actions/cache@v4
        with:
          path: C:\installer-cache
          key: installers-${{ matrix.app }}-${{ steps.week.outputs.w }}
          restore-keys: installers-${{ matrix.app }}-
      - name: Package and deploy as Intune would
        shell: powershell
        env:
          INSTALLER_CACHE: C:\installer-cache
          APP_NAME: ${{ matrix.app }}
          APP_URL: ${{ matrix.url }}
          APP_URL2: ${{ matrix.url2 }}
          APP_SCENARIO: ${{ matrix.scenario }}
          APP_DEPLOY: ${{ matrix.deploy }}
        run: ./tests/real-installs.ps1
